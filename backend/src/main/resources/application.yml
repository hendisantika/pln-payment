server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/pln_payment?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Jakarta
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

# IAK API Configuration
iak:
  base-url: https://testprepaid.mobilepulsa.net  # Sandbox
  username: ${IAK_USERNAME:your_username}
  api-key: ${IAK_API_KEY:your_api_key}
  # Production URLs:
  # prepaid: https://prepaid.iak.id
  # postpaid: https://mobilepulsa.net

logging:
  level:
    com.hendisantika.pln: DEBUG
